[package]
name = "lj-hub"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Local-first Logitech gaming device profile manager"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
hidapi = "2.6.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
