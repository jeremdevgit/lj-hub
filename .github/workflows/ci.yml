name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
            binary: target/release/lj-hub
          - os: macos-15
            artifact: macos-arm64
            binary: target/release/lj-hub
          - os: windows-2025
            artifact: windows-x64
            binary: target/release/lj-hub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Format
        run: cargo +stable fmt --all --check
      - name: Test
        run: cargo +stable test --locked
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo +stable build --locked --release
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler not found' }
          & $compiler installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\LJ-Hub-*-Windows-Setup.exe | Select-Object -First 1).FullName
          $folder = Join-Path $env:RUNNER_TEMP 'lj-hub-install-smoke'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$folder") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $folder 'lj-hub.exe'))) { throw 'Installed executable missing' }
          $uninstaller = (Get-ChildItem (Join-Path $folder 'unins*.exe') | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/NORESTART') -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited with $($process.ExitCode)" }
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: zsh installer/macos/package.sh
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: bash installer/linux/package.sh
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lj-hub-installer-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
          if-no-files-found: error
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
