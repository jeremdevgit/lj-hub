name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
            binary: target/release/lj-hub
          - os: macos-15
            artifact: macos-arm64
            binary: target/release/lj-hub
          - os: windows-2025
            artifact: windows-x64
            binary: target/release/lj-hub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Format
        run: cargo +stable fmt --all --check
      - name: Test
        run: cargo +stable test --locked
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo +stable build --locked --release
      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lj-hub-${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
